name: Build & Release SnipTool

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SnipTool-win64
        path: build/SnipTool.exe
        if-no-files-found: error

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/SnipTool.exe
        name: SnipTool ${{ github.ref_name }}
        body: |
          ### SnipTool ${{ github.ref_name }}
          
          Простая утилита «Ножницы + рисовалка».
          
          **Горячая клавиша:** `Ctrl + Shift + S`
          
          - Выбор области с затемнением
          - Рисование (карандаш, линия, прямоугольник)
          - Копирование в буфер и сохранение в PNG/BMP
          - Контекстное меню в трее → Exit
          
          Просто скачайте `SnipTool.exe` и запустите.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
